name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: astra_ci
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://astra:astra@localhost:5432/astra_ci
      TEST_DATABASE_URL: postgresql+psycopg://astra:astra@localhost:5432/astra_ci
      ASTRA_REQUIRE_TEST_DATABASE: "true"
      JWT_SECRET: ci-secret-key-for-quality-gate-tests
      JWT_SECRET_KEY: ci-secret-key
      DOCUMENT_STORAGE_PATH: /tmp/astra-documents
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        id: verify-source-sha
        shell: bash
        run: |
          checkout_sha="$(git rev-parse HEAD)"
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$expected_sha" ] || [ "$checkout_sha" != "$expected_sha" ]; then
            echo "Checked-out revision $checkout_sha does not match canonical source $expected_sha"
            exit 1
          fi
          echo "REMEDIATION_CHECKOUT_SHA=$checkout_sha" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r ../scripts/test-requirements.txt
      - name: Check generated OpenAPI frontend types
        run: python scripts/generate_openapi_types.py --check
      - name: Test remediation evidence validator
        run: |
          python -m pytest \
            scripts/tests/test_validate_pr3_remediation_closure.py \
            scripts/tests/test_release_evidence.py \
            scripts/tests/test_repository_governance.py \
            scripts/tests/test_native_dev.py \
            -q
      - name: Recheck source integrity
        id: recheck-source-before-migrations
        shell: bash
        run: |
          set -euo pipefail
          expected="${REMEDIATION_CHECKOUT_SHA:?missing verified source SHA}"
          actual="$(git rev-parse HEAD)"
          workspace="$(git rev-parse --show-toplevel)"
          test "$actual" = "$expected"
          test "$workspace" = "$GITHUB_WORKSPACE"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          for state in MERGE_HEAD REBASE_HEAD CHERRY_PICK_HEAD REVERT_HEAD BISECT_LOG; do
            test ! -e "$(git rev-parse --git-path "$state")"
          done
          echo "REMEDIATION_CHECKOUT_SHA=$actual" >> "$GITHUB_ENV"
      - name: Run database migrations
        id: membership_migrations
        working-directory: backend
        run: |
          set -o pipefail
          evidence_dir="../.remediation-evidence/backend"
          mkdir -p "$evidence_dir"
          started_at="$(date --iso-8601=seconds)"
          {
            test "$(alembic heads | wc -l)" -eq 1
            alembic upgrade head
            alembic downgrade 0056_reception_note_patient_concurrency
            python ../scripts/validate_0057_clinic_membership_transition.py cleanup
            python ../scripts/validate_0057_clinic_membership_transition.py seed-single
            alembic upgrade head
            python ../scripts/validate_0057_clinic_membership_transition.py check-single
            alembic downgrade 0056_reception_note_patient_concurrency
            python ../scripts/validate_0057_clinic_membership_transition.py cleanup
            python ../scripts/validate_0057_clinic_membership_transition.py seed-multi
            alembic upgrade 0069_legacy_document_trust
            python ../scripts/validate_0057_clinic_membership_transition.py seed-unsafe-ambiguous-memberships
            alembic upgrade head
            python ../scripts/validate_0057_clinic_membership_transition.py check-multi
            alembic downgrade 0069_legacy_document_trust
            alembic upgrade head
            python ../scripts/validate_0057_clinic_membership_transition.py check-multi
            alembic downgrade 0062_signed_report_addendum_integrity
            python ../scripts/validate_0063_document_provenance.py seed
            alembic upgrade 0063_clinical_document_institution_provenance
            python ../scripts/validate_0064_0066_scope_provenance.py seed
            alembic upgrade head
            python ../scripts/validate_0063_document_provenance.py check
            python ../scripts/validate_0064_0066_scope_provenance.py check
            alembic downgrade 0062_signed_report_addendum_integrity
            alembic upgrade head
          } 2>&1 | tee "$evidence_dir/populated_legacy_upgrade.log"
          completed_at="$(date --iso-8601=seconds)"
          python ../scripts/validate_pr3_remediation_closure.py produce \
            --unit populated_legacy_upgrade \
            --source-sha "$REMEDIATION_CHECKOUT_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --job-name "$GITHUB_JOB" \
            --test-command "alembic populated legacy transition and downgrade/re-upgrade" \
            --output-log "$evidence_dir/populated_legacy_upgrade.log" \
            --evidence-file "$evidence_dir/populated_legacy_upgrade.json" \
            --started-at "$started_at" \
            --completed-at "$completed_at"
      - name: Run PR3 security regression gate
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_contract_hardening.py::test_production_example_uses_one_same_origin_browser_auth_contract \
            tests/test_browser_sessions.py::test_csrf_token_from_another_session_is_rejected \
            tests/test_browser_sessions.py::test_invalid_browser_session_audit_survives_unauthorized_response \
            tests/test_browser_sessions.py::test_security_audit_commit_does_not_commit_business_transaction \
            tests/test_institution_clinical_document_access.py::test_unresolved_document_is_hidden_from_all_standard_clinical_read_paths \
            tests/test_institution_clinical_document_access.py::test_processing_jobs_do_not_disclose_foreign_or_unresolved_documents \
            tests/test_pr3_scope_audit_blockers.py \
            tests/test_remaining_patient_scope.py
      - name: Run fast backend feedback gate
        working-directory: backend
        run: python ../scripts/run_test_gate.py fast
      - name: Run backend non-integration tests
        working-directory: backend
        run: python -m pytest -m "not integration"
      - name: Run explicit PostgreSQL integration gate
        working-directory: backend
        run: python -m pytest tests/integration -q -rs
      - name: Validate synthetic test backup and restore
        env:
          SOURCE_DATABASE_URL: postgresql://astra:astra@localhost:5432/astra_ci
          TARGET_DATABASE_URL: postgresql://astra:astra@localhost:5432/astra_restore_test
        run: docker run --rm --network host -v "$PWD:/workspace:ro" -w /workspace -e SOURCE_DATABASE_URL -e TARGET_DATABASE_URL postgres:16-alpine sh scripts/validate_test_backup_restore.sh
      - name: Recheck source integrity
        id: recheck-source-before-backend-evidence
        shell: bash
        run: |
          set -euo pipefail
          expected="${REMEDIATION_CHECKOUT_SHA:?missing verified source SHA}"
          actual="$(git rev-parse HEAD)"
          workspace="$(git rev-parse --show-toplevel)"
          test "$actual" = "$expected"
          test "$workspace" = "$GITHUB_WORKSPACE"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          for state in MERGE_HEAD REBASE_HEAD CHERRY_PICK_HEAD REVERT_HEAD BISECT_LOG; do
            test ! -e "$(git rev-parse --git-path "$state")"
          done
          echo "REMEDIATION_CHECKOUT_SHA=$actual" >> "$GITHUB_ENV"
      - name: Produce episode and proxy execution evidence
        working-directory: backend
        run: |
          set -o pipefail
          evidence_dir="../.remediation-evidence/backend"
          mkdir -p "$evidence_dir"

          episode_started="$(date --iso-8601=seconds)"
          python -m pytest -vv \
            tests/test_pr3_second_security_rescan.py::test_episode_projection_includes_same_institution_clinics_but_excludes_foreign_institution \
            2>&1 | tee "$evidence_dir/cross_scope_dto_projection.log"
          episode_completed="$(date --iso-8601=seconds)"
          python ../scripts/validate_pr3_remediation_closure.py produce \
            --unit cross_scope_dto_projection \
            --source-sha "$REMEDIATION_CHECKOUT_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --job-name "$GITHUB_JOB" \
            --test-command "pytest episode cross-scope projection sentinel" \
            --output-log "$evidence_dir/cross_scope_dto_projection.log" \
            --evidence-file "$evidence_dir/cross_scope_dto_projection.json" \
            --started-at "$episode_started" \
            --completed-at "$episode_completed"

          proxy_started="$(date --iso-8601=seconds)"
          python -m pytest -vv \
            tests/test_audit.py::test_untrusted_peer_cannot_spoof_audit_client_ip \
            tests/test_audit.py::test_audit_record_persists_resolved_trusted_proxy_client_ip \
            tests/test_contract_hardening.py::test_production_compose_example_uses_placeholders_not_demo_secrets \
            2>&1 | tee "$evidence_dir/deployment_proxy_boundary.log"
          proxy_completed="$(date --iso-8601=seconds)"
          python ../scripts/validate_pr3_remediation_closure.py produce \
            --unit deployment_proxy_boundary \
            --source-sha "$REMEDIATION_CHECKOUT_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --job-name "$GITHUB_JOB" \
            --test-command "pytest proxy spoof, persisted audit IP, and production compose contract" \
            --output-log "$evidence_dir/deployment_proxy_boundary.log" \
            --evidence-file "$evidence_dir/deployment_proxy_boundary.json" \
            --started-at "$proxy_started" \
            --completed-at "$proxy_completed"
      - name: Recheck source integrity
        id: recheck-source-before-backend-upload
        shell: bash
        run: |
          set -euo pipefail
          expected="${REMEDIATION_CHECKOUT_SHA:?missing verified source SHA}"
          actual="$(git rev-parse HEAD)"
          workspace="$(git rev-parse --show-toplevel)"
          test "$actual" = "$expected"
          test "$workspace" = "$GITHUB_WORKSPACE"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          for state in MERGE_HEAD REBASE_HEAD CHERRY_PICK_HEAD REVERT_HEAD BISECT_LOG; do
            test ! -e "$(git rev-parse --git-path "$state")"
          done
          echo "REMEDIATION_CHECKOUT_SHA=$actual" >> "$GITHUB_ENV"
      - name: Upload backend remediation evidence
        uses: actions/upload-artifact@v6
        with:
          name: remediation-evidence-backend
          path: .remediation-evidence/backend
          if-no-files-found: error
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        id: verify-source-sha
        shell: bash
        run: |
          checkout_sha="$(git rev-parse HEAD)"
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$expected_sha" ] || [ "$checkout_sha" != "$expected_sha" ]; then
            echo "Checked-out revision $checkout_sha does not match canonical source $expected_sha"
            exit 1
          fi
          echo "REMEDIATION_CHECKOUT_SHA=$checkout_sha" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Test frontend interactions
        working-directory: frontend
        run: npm test -- --run
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E smoke
        working-directory: frontend
        run: npm run e2e
      - name: Frontend pilot smoke
        working-directory: frontend
        run: npm run smoke
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Recheck source integrity
        id: recheck-source-before-frontend-evidence
        shell: bash
        run: |
          set -euo pipefail
          expected="${REMEDIATION_CHECKOUT_SHA:?missing verified source SHA}"
          actual="$(git rev-parse HEAD)"
          workspace="$(git rev-parse --show-toplevel)"
          test "$actual" = "$expected"
          test "$workspace" = "$GITHUB_WORKSPACE"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          for state in MERGE_HEAD REBASE_HEAD CHERRY_PICK_HEAD REVERT_HEAD BISECT_LOG; do
            test ! -e "$(git rev-parse --git-path "$state")"
          done
          echo "REMEDIATION_CHECKOUT_SHA=$actual" >> "$GITHUB_ENV"
      - name: Produce clinic-context execution evidence
        working-directory: frontend
        run: |
          set -o pipefail
          evidence_dir="../.remediation-evidence/frontend"
          mkdir -p "$evidence_dir"
          started_at="$(date --iso-8601=seconds)"
          npx vitest run src/pages/DailyClinicDashboard.test.tsx --reporter=verbose \
            2>&1 | tee "$evidence_dir/context_initialization.log"
          completed_at="$(date --iso-8601=seconds)"
          python ../scripts/validate_pr3_remediation_closure.py produce \
            --unit context_initialization \
            --source-sha "$REMEDIATION_CHECKOUT_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --job-name "$GITHUB_JOB" \
            --test-command "vitest DailyClinicDashboard context readiness, switch, and midnight" \
            --output-log "$evidence_dir/context_initialization.log" \
            --evidence-file "$evidence_dir/context_initialization.json" \
            --started-at "$started_at" \
            --completed-at "$completed_at"
      - name: Recheck source integrity
        id: recheck-source-before-frontend-upload
        shell: bash
        run: |
          set -euo pipefail
          expected="${REMEDIATION_CHECKOUT_SHA:?missing verified source SHA}"
          actual="$(git rev-parse HEAD)"
          workspace="$(git rev-parse --show-toplevel)"
          test "$actual" = "$expected"
          test "$workspace" = "$GITHUB_WORKSPACE"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          for state in MERGE_HEAD REBASE_HEAD CHERRY_PICK_HEAD REVERT_HEAD BISECT_LOG; do
            test ! -e "$(git rev-parse --git-path "$state")"
          done
          echo "REMEDIATION_CHECKOUT_SHA=$actual" >> "$GITHUB_ENV"
      - name: Upload frontend remediation evidence
        uses: actions/upload-artifact@v6
        with:
          name: remediation-evidence-frontend
          path: .remediation-evidence/frontend
          if-no-files-found: error
          retention-days: 14

  e2e-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: astra_ci_e2e
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra_ci_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASTRA_E2E_DATABASE_URL: postgresql+psycopg://astra:astra@127.0.0.1:5432/astra_ci_e2e_run
      JWT_SECRET: ci-e2e-jwt-secret-with-no-production-value
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        id: verify-source-sha
        shell: bash
        run: |
          checkout_sha="$(git rev-parse HEAD)"
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$expected_sha" ] || [ "$checkout_sha" != "$expected_sha" ]; then
            echo "Checked-out revision $checkout_sha does not match canonical source $expected_sha"
            exit 1
          fi
          echo "REMEDIATION_CHECKOUT_SHA=$checkout_sha" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Recheck source integrity
        id: recheck-source-before-e2e-evidence
        shell: bash
        run: |
          set -euo pipefail
          expected="${REMEDIATION_CHECKOUT_SHA:?missing verified source SHA}"
          actual="$(git rev-parse HEAD)"
          workspace="$(git rev-parse --show-toplevel)"
          test "$actual" = "$expected"
          test "$workspace" = "$GITHUB_WORKSPACE"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          for state in MERGE_HEAD REBASE_HEAD CHERRY_PICK_HEAD REVERT_HEAD BISECT_LOG; do
            test ! -e "$(git rev-parse --git-path "$state")"
          done
          echo "REMEDIATION_CHECKOUT_SHA=$actual" >> "$GITHUB_ENV"
      - name: Run DB-backed full-stack E2E smoke
        working-directory: frontend
        run: |
          set -o pipefail
          evidence_dir="../.remediation-evidence/e2e-db"
          mkdir -p "$evidence_dir"
          started_at="$(date --iso-8601=seconds)"
          npm run e2e:db 2>&1 | tee "$evidence_dir/transitional_workflow_rediscovery.log"
          completed_at="$(date --iso-8601=seconds)"
          python ../scripts/validate_pr3_remediation_closure.py produce \
            --unit transitional_workflow_rediscovery \
            --source-sha "$REMEDIATION_CHECKOUT_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --job-name "$GITHUB_JOB" \
            --test-command "DB-backed Playwright source classification reload and one-way transition" \
            --output-log "$evidence_dir/transitional_workflow_rediscovery.log" \
            --evidence-file "$evidence_dir/transitional_workflow_rediscovery.json" \
            --started-at "$started_at" \
            --completed-at "$completed_at"
      - name: Recheck source integrity
        id: recheck-source-before-e2e-upload
        shell: bash
        run: |
          set -euo pipefail
          expected="${REMEDIATION_CHECKOUT_SHA:?missing verified source SHA}"
          actual="$(git rev-parse HEAD)"
          workspace="$(git rev-parse --show-toplevel)"
          test "$actual" = "$expected"
          test "$workspace" = "$GITHUB_WORKSPACE"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          for state in MERGE_HEAD REBASE_HEAD CHERRY_PICK_HEAD REVERT_HEAD BISECT_LOG; do
            test ! -e "$(git rev-parse --git-path "$state")"
          done
          echo "REMEDIATION_CHECKOUT_SHA=$actual" >> "$GITHUB_ENV"
      - name: Upload DB-backed remediation evidence
        uses: actions/upload-artifact@v6
        with:
          name: remediation-evidence-e2e-db
          path: .remediation-evidence/e2e-db
          if-no-files-found: error
          retention-days: 14

  remediation-evidence:
    if: always()
    needs:
      - backend
      - frontend
      - e2e-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        id: verify-source-sha
        shell: bash
        run: |
          checkout_sha="$(git rev-parse HEAD)"
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$expected_sha" ] || [ "$checkout_sha" != "$expected_sha" ]; then
            echo "Checked-out revision $checkout_sha does not match canonical source $expected_sha"
            exit 1
          fi
          echo "REMEDIATION_CHECKOUT_SHA=$checkout_sha" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require every evidence producer job to succeed
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] \
            || [ "${{ needs.frontend.result }}" != "success" ] \
            || [ "${{ needs.e2e-db.result }}" != "success" ]; then
            echo "Evidence producer result: backend=${{ needs.backend.result }}, frontend=${{ needs.frontend.result }}, e2e-db=${{ needs.e2e-db.result }}"
            exit 1
          fi
      - name: Recheck source integrity
        id: recheck-source-before-artifact-intake
        shell: bash
        run: |
          set -euo pipefail
          expected="${REMEDIATION_CHECKOUT_SHA:?missing verified source SHA}"
          actual="$(git rev-parse HEAD)"
          workspace="$(git rev-parse --show-toplevel)"
          test "$actual" = "$expected"
          test "$workspace" = "$GITHUB_WORKSPACE"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          for state in MERGE_HEAD REBASE_HEAD CHERRY_PICK_HEAD REVERT_HEAD BISECT_LOG; do
            test ! -e "$(git rev-parse --git-path "$state")"
          done
          echo "REMEDIATION_CHECKOUT_SHA=$actual" >> "$GITHUB_ENV"
      - name: Download remediation execution evidence
        uses: actions/download-artifact@v8
        with:
          pattern: remediation-evidence-*
          path: .remediation-evidence/final
          merge-multiple: true
      - name: Validate exact-SHA remediation execution evidence
        run: |
          python scripts/validate_pr3_remediation_closure.py validate \
            --evidence-dir .remediation-evidence/final \
            --source-sha "$REMEDIATION_CHECKOUT_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"
      - name: Recheck source integrity
        id: recheck-source-before-canonical-evidence
        shell: bash
        run: |
          set -euo pipefail
          expected="${REMEDIATION_CHECKOUT_SHA:?missing verified source SHA}"
          actual="$(git rev-parse HEAD)"
          workspace="$(git rev-parse --show-toplevel)"
          test "$actual" = "$expected"
          test "$workspace" = "$GITHUB_WORKSPACE"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          for state in MERGE_HEAD REBASE_HEAD CHERRY_PICK_HEAD REVERT_HEAD BISECT_LOG; do
            test ! -e "$(git rev-parse --git-path "$state")"
          done
          echo "REMEDIATION_CHECKOUT_SHA=$actual" >> "$GITHUB_ENV"
      - name: Produce and validate canonical release evidence
        run: |
          generated_at="$(date --iso-8601=seconds)"
          mkdir -p release-evidence
          python scripts/release_evidence.py produce \
            --evidence-dir .remediation-evidence/final \
            --source-sha "$REMEDIATION_CHECKOUT_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-name "$GITHUB_WORKFLOW" \
            --workflow-event "$GITHUB_EVENT_NAME" \
            --producer-result backend=${{ needs.backend.result }} \
            --producer-result frontend=${{ needs.frontend.result }} \
            --producer-result e2e-db=${{ needs.e2e-db.result }} \
            --output release-evidence/release-evidence.json \
            --generated-at "$generated_at"
          python scripts/release_evidence.py validate \
            --manifest release-evidence/release-evidence.json \
            --source-sha "$REMEDIATION_CHECKOUT_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"
          python scripts/release_evidence.py truth-report \
            --document docs/RELEASE_CHECKLIST.md \
            --document docs/release-evidence-contract.md \
            --source-sha "$REMEDIATION_CHECKOUT_SHA" \
            --migration-head "0071_membership_taxonomy"
      - name: Recheck source integrity
        id: recheck-source-before-canonical-upload
        shell: bash
        run: |
          set -euo pipefail
          expected="${REMEDIATION_CHECKOUT_SHA:?missing verified source SHA}"
          actual="$(git rev-parse HEAD)"
          workspace="$(git rev-parse --show-toplevel)"
          test "$actual" = "$expected"
          test "$workspace" = "$GITHUB_WORKSPACE"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          for state in MERGE_HEAD REBASE_HEAD CHERRY_PICK_HEAD REVERT_HEAD BISECT_LOG; do
            test ! -e "$(git rev-parse --git-path "$state")"
          done
          echo "REMEDIATION_CHECKOUT_SHA=$actual" >> "$GITHUB_ENV"
      - name: Upload canonical release evidence
        uses: actions/upload-artifact@v6
        with:
          name: release-evidence
          path: release-evidence
          if-no-files-found: error
          retention-days: 14
